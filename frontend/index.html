<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="SquadLink — a premium desktop communication platform for gamers and streamers. Connect, play, together." />
    <title>SquadLink — Connect · Play · Together</title>
    <style>
      /* Static pre-boot loader — shown before React mounts, so there's
         no blank white flash while the JS bundle parses. main.tsx's
         createRoot(...).render(...) replaces #root's contents, so this
         markup just disappears the instant the app takes over. */
      #root {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
      }
      #boot-loader { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      #boot-loader img { width: 72px; height: 72px; border-radius: 12px; }
      #boot-loader .dots { display: flex; gap: 6px; }
      #boot-loader .dots span {
        width: 6px; height: 6px; border-radius: 999px; background: #f2691c;
        animation: boot-bounce 1.1s ease-in-out infinite;
      }
      #boot-loader .dots span:nth-child(2) { animation-delay: 0.15s; }
      #boot-loader .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-6px); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader">
        <img src="/logo.png" alt="" />
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
